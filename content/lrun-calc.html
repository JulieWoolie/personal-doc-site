<h2>Calulator</h2>
<form style="text-align: left;">
  <table>
    <tbody>
    <tr>
      <th colspan="2">Inputs</th>
    </tr>
    <tr>
      <td>Shift</td>
      <td class="shift-inputs">
        <div>
          <input id="regular" type="radio" name="shift" checked>
          <label for="regular">Regular</label>
        </div>
        <div>
          <input id="night" type="radio" name="shift">
          <label for="night">Night</label>
        </div>
        <div>
          <input id="customshift" type="radio" name="shift">
          <input id="customshift-length" style="display: inline; width: 25%;" placeholder="hh:mm">
        </div>
      </td>
    </tr>
    <tr>
      <td>Labor Run Mach</td>
      <td><input name="lrun" id="ilrun" style="width: auto;"></td>
    </tr>
    <tr>
      <td>Produced + broken (eg: 13+7)</td>
      <td><input name="prod" id="iprod" style="width: auto;"></td>
    </tr>
    <tr>
      <td>Machine Cavities</td>
      <td>
        <div style="display: flex;">
          <span id="cavities-num" style="width: 10%;">1</span>
          <input
              name="cavities" id="icavities"
              type="range" min="1" max="10" step="1" value="1"
              style="padding: 0; outline: unset; flex-grow: 1;"
          >
        </div>
      </td>
    </tr>
    </tbody>
  </table>
  <table>
    <tbody>
    <tr>
      <th colspan="2" style="padding-top: 20px;">Results</th>
    </tr>
    <tr>
      <td>Target Quantity</td>
      <td id="target" display="pcs"></td>
    </tr>
    <tr>
      <td>Time loss</td>
      <td id="timeloss"></td>
    </tr>
    <tr>
      <td>Rounded Time loss</td>
      <td id="timeloss-rounded"></td>
    </tr>
    <tr>
      <td>Ideal Cycle Time</td>
      <td id="runtime" display="seconds"></td>
    </tr>
    <tr>
      <td>Compensated Cycle Time</td>
      <td id="runtime-smart" display="seconds"></td>
    </tr>
    </tbody>
  </table>
</form>

<script>
  const timeloss = document.getElementById("timeloss")
  const timelossRounded = document.getElementById("timeloss-rounded")
  const targetq = document.getElementById("target")
  const prod = document.getElementById("iprod")
  const lrun = document.getElementById("ilrun")
  const regularShift = document.getElementById("regular")
  const nightShift = document.getElementById("night")
  const customShift = document.getElementById("customshift")
  const customShiftLen = document.getElementById("customshift-length")

  const cavitiesIn = document.getElementById("icavities")
  const cavitiesNum = document.getElementById("cavities-num")
  const runtime1 = document.getElementById("runtime")
  const runtime2 = document.getElementById("runtime-smart")

  lrun.oninput = updateResult
  prod.oninput = updateResult
  regularShift.oninput = updateResult
  nightShift.oninput = updateResult
  customShift.oninput = () => {
    if (customShiftLen.value.length === 0) {
      saveParams()
      return
    }
    updateResult()
  }
  customShiftLen.oninput = () => {
    if (!customShift.checked) {
      saveParams()
      return
    }
    updateResult()
  }
  customShiftLen.onclick = () => {
    nightShift.checked = false
    regularShift.checked = false
    customShift.checked = true

    if (customShiftLen.value.length === 0) {
      saveParams()
      return
    }

    updateResult()
  }

  cavitiesIn.oninput = () => {
    cavitiesNum.textContent = cavitiesIn.value
    updateResult()
  }
  targetq.onclick = () => {
    let display = targetq.getAttribute("display")
    if (display === "pcs") {
      display = "cycles"
    } else {
      display = "pcs"
    }
    targetq.setAttribute("display", display)
    updateResult()
  }

  runtime1.onclick = () => { switchTimeFormat(runtime1) }
  runtime2.onclick = () => { switchTimeFormat(runtime2) }

  function switchTimeFormat(el) {
    let format = el.getAttribute("display")
    if (format === "minutes") {
      format = "seconds"
    } else {
      format = "minutes"
    }

    el.setAttribute("display", format)
    updateResult()
  }

  loadParams()

  function loadParams() {
    const lr = localStorage.getItem("lrun-calc::labor_run")
    const produced = localStorage.getItem("lrun-calc::produced")
    const type = localStorage.getItem("lrun-calc::shift_type")
    const cavs = localStorage.getItem("lrun-calc::cavities")
    const r1Display = localStorage.getItem("lrun::r1display")
    const r2Display = localStorage.getItem("lrun::r2display")
    const cshiftLen = localStorage.getItem("lrun::customlength")
    const targetQuantDisplay = localStorage.getItem("lrun::targetdisplay")

    let callUpdate = false

    if (targetQuantDisplay) {
      targetq.setAttribute("display", targetQuantDisplay)
    }

    if (cavs) {
      cavitiesIn.value = cavs
      cavitiesNum.textContent = cavs
    }
    if (lr) {
      lrun.value = lr
      callUpdate = true
    }
    if (produced) {
      prod.value = produced
      callUpdate = true
    }
    if (type) {
      if (type === "night") {
        nightShift.checked = true
        regularShift.checked = false
        customShift.checked = false
      } else if (type === "custom") {
        nightShift.checked = false
        regularShift.checked = false
        customShift.checked = true
      } else {
        nightShift.checked = false
        regularShift.checked = true
        customShift.checked = false
      }
    }
    if (cshiftLen) {
      customShiftLen.value = cshiftLen

      if (type === "custom") {
        callUpdate = true
      }
    }

    if (r1Display) {
      runtime1.setAttribute("display", r1Display)
    }
    if (r2Display) {
      runtime2.setAttribute("display", r2Display)
    }

    if (callUpdate) {
      updateResult()
    }
  }

  function calculateRuntimes(laborRun, shiftTime, cavs) {
    const totalBreaksTime = 50
    const compensation = 50

    const target = (laborRun / cavs) * shiftTime
    const lengthMins = (shiftTime * 60) - (totalBreaksTime + compensation)

    const cycleTimeSeconds = 3600 / (laborRun / cavs)
    const cycleTimeSmart = (lengthMins * 60) / target

    setRuntimeText(runtime1, Math.ceil(cycleTimeSeconds))
    setRuntimeText(runtime2, Math.ceil(cycleTimeSmart))
  }

  function formatTime(valueSeconds, useHours = true) {
    let secs = valueSeconds

    let hours

    if (useHours) {
      hours = Math.floor(valueSeconds / 3600)
      secs -= hours * 3600
    } else {
      hours = 0
    }

    let mins = Math.floor(secs / 60)
    secs -= mins * 60

    if (useHours) {
      return `${hours.toString().padStart(2, '0')}:${String(mins).padStart(2, '0')}:${Math.floor(secs).toString().padStart(2, '0')}`
    } else {
      return `${String(mins).padStart(2, '0')}:${Math.floor(secs).toString().padStart(2, '0')}`
    }
  }

  function setRuntimeText(el, valueSeconds) {
    let format = el.getAttribute("display")

    if (format === "minutes") {
      el.textContent = formatTime(valueSeconds)
      return
    }

    el.textContent = `${Math.ceil(valueSeconds)} seconds`
  }

  function saveParams() {
    localStorage.setItem("lrun-calc::labor_run", lrun.value)
    localStorage.setItem("lrun-calc::produced", prod.value)
    localStorage.setItem("lrun-calc::cavities", cavitiesIn.value)
    localStorage.setItem("lrun::customlength", customShiftLen.value)
    localStorage.setItem("lrun::r1display", runtime1.getAttribute("display"))
    localStorage.setItem("lrun::r2display", runtime2.getAttribute("display"))
    localStorage.setItem("lrun::targetdisplay", targetq.getAttribute("display"))

    let shiftType
    if (nightShift.checked) {
      shiftType = "night"
    } else if (regularShift.checked) {
      shiftType = "regular"
    } else {
      shiftType = "custom"
    }

    localStorage.setItem("lrun-calc::shift_type", shiftType)
  }

  function getShiftLength() {
    if (regularShift.checked) {
      return 8
    } else if (nightShift.checked) {
      return 7
    }

    let hhmmStr = customShiftLen.value
    let split = hhmmStr.split(":");

    if (split.length === 1) {
      return parseFloat(split[0])
    }

    const h = parseFloat(split[0])
    const m = parseFloat(split[1])
    return h + (m / 60)
  }

  function updateResult() {
    saveParams()

    let hours = getShiftLength()
    let prodRun = 0
    let laborRun = 0

    let prVal = trim(prod.value)
    let lrVal = trim(lrun.value)

    try {
      prodRun = parseNum(prVal)
      laborRun = parseNum(lrVal)
    } catch (e) {
      return
    }

    const cavities = parseFloat(cavitiesIn.value)
    calculateRuntimes(laborRun, hours, cavities)

    const targetQ = hours * laborRun
    const missed = targetQ - prodRun

    const targetFormat = targetq.getAttribute("display")
    if (targetFormat === "pcs") {
      targetq.textContent = `${targetQ.toFixed(2)} pcs`
    } else {
      targetq.textContent = `${(targetQ / cavities).toFixed(2)} cycles`
    }

    if (missed <= 0) {
      timeloss.textContent = `None! (${-Math.floor(missed)} extra)`
      timelossRounded.textContent = ""
      return
    }

    const timeLossMins = (missed / laborRun) * 60
    timeloss.textContent = `${timeLossMins.toFixed(2)} minutes`
    timelossRounded.textContent = `${roundLoss(timeLossMins)} minutes`
  }

  function roundLoss(num) {
    return Math.ceil(num / 5) * 5
  }

  function isOmittedChar(ch) {
    return ch === " " || ch === "+"
  }

  function trim(val) {
    let start = 0
    let end = val.length

    for (let i = 0; i < val.length; i++) {
      if (!isOmittedChar(val[i])) {
        break
      }
      start++
    }

    if (start >= end) {
      return ""
    }

    for (let i = val.length - 1; i >= 0; i--) {
      if (!isOmittedChar(val[i])) {
        break
      }
      end--
    }

    return val.substring(start, end)
  }

  function parseNum(val) {
    if (val.includes("+")) {
      const split = val.split("+")
      let v = 0

      for (const str of split) {
        v += parseFloat(trim(str))
      }
      return v
    }

    return parseFloat(trim(val))
  }
</script>

<style>
#customshift:not(:checked) + #customshift-length {
  color: gray;
}
.shift-inputs {
  input:not(:checked) + label {
    color: gray;
  }
}
</style>
